services:
  - type: web
    name: creator-label
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Feature flag do motor dinâmico — DEVE começar desligada em todo deploy.
      # Ativar manualmente no painel do Render só após aprovação do primeiro
      # evento piloto (ver docs/plano-motor-dinamico-etiquetas.md).
      - key: LABEL_DYNAMIC_LAYOUT_ENABLED
        value: "false"
      - key: LABEL_DYNAMIC_EVENT_IDS
        value: ""
      # Rotação + tamanho de saída só em /badge dinâmico (contrato TSPL do
      # app: size width:50 height:80). Layout do editor e /v2 ficam 80x50.
      # Futuro (outra impressora): ajustar rotation / mm / dpi sem redesenhar.
      - key: LABEL_BADGE_OUTPUT_ROTATION
        value: "90"
      - key: LABEL_BADGE_OUTPUT_WIDTH_MM
        value: "50"
      - key: LABEL_BADGE_OUTPUT_HEIGHT_MM
        value: "80"
      - key: LABEL_BADGE_PRINTER_DPI
        value: "203"
      # Segredos — definir manualmente no painel do Render, nunca neste arquivo.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: LABEL_API_KEY
        sync: false
      - key: LABEL_LOGO_ALLOWED_HOSTS
        sync: false
      - key: LABEL_LAYOUT_CACHE_TTL_SECONDS
        value: "60"
      - key: LABEL_CONTEXT_CACHE_TTL_SECONDS
        value: "60"
      - key: LABEL_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: LABEL_RATE_LIMIT_MAX
        value: "600"
      - key: LABEL_CONCURRENCY_LIMIT
        value: "40"
